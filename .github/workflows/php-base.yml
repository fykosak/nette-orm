name: Tests

on: [pull_request]

jobs:
  test:
    name: With PHP ${{ matrix.php }} script ${{matrix.script}}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.5' ]
        script: ['testPSR', 'testPHPStan']
    steps:
      - uses: actions/checkout@v2
        name: Checkout
        with:
          submodules: recursive
      - uses: shivammathur/setup-php@v2
        name: Setup PHP
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, mysql, soap, xml
          tools: composer
          ini-values: session.gc_probability=0, date.timezone="Europe/Prague", display_startup_errors = Off
      - name: Composer install
        run: composer install --no-progress --prefer-dist
      - name: Run ${{ matrix.script }}
        run: composer run-script ${{ matrix.script }}
